<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ask the Health Library: a RAG assistant that answers from NIH patient guides">
<title>Ask the Health Library: a RAG assistant that answers from NIH patient guides</title>
<style>
:root{--bg:#ffffff;--panel:#f3f8f8;--line:#b7d0d3;--node:#e0f2ef;--accent:#0f8b7e;--ink:#12323a;--muted:#4f6a74;--hot:#d9363e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1720;--panel:#13222c;--line:#2e4a57;--node:#143530;--accent:#3fc8b7;--ink:#e7f3f2;--muted:#a3bbc4;--hot:#ff7a7f}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.t{fill:#fff;font-weight:700;font-size:54px;letter-spacing:-.5px}
.s{fill:#d6f5f0;font-size:21px}
.c{fill:#fff;opacity:.13;animation:float var(--d) ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-22px)}}
.base{fill:none;stroke:#fff;stroke-opacity:.2;stroke-width:2}
.comet{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:18 82;animation:run 5s linear infinite}
@keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.up{animation:up .9s ease-out both}.up2{animation:up .9s .25s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b6f74"/><stop offset="1" stop-color="#16a085"/></linearGradient></defs>
<rect width="1200" height="260" rx="18" fill="url(#g)"/>
<circle class="c" cx="90" cy="60" r="22" style="--d:7s"/>
<circle class="c" cx="1090" cy="70" r="30" style="--d:9s"/>
<circle class="c" cx="1010" cy="205" r="16" style="--d:6s"/>
<circle class="c" cx="190" cy="205" r="14" style="--d:8s"/>
<circle class="c" cx="640" cy="40" r="10" style="--d:5s"/>
<path class="base" d="M0,212 H70 l14,-10.5 l14,10.5 H112 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H190 l14,-12.6 l14,12.6 H310 l14,-10.5 l14,10.5 H352 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H430 l14,-12.6 l14,12.6 H550 l14,-10.5 l14,10.5 H592 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H670 l14,-12.6 l14,12.6 H790 l14,-10.5 l14,10.5 H832 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H910 l14,-12.6 l14,12.6 H1030 l14,-10.5 l14,10.5 H1072 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H1150 l14,-12.6 l14,12.6"/><path class="comet" pathLength="100" d="M0,212 H70 l14,-10.5 l14,10.5 H112 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H190 l14,-12.6 l14,12.6 H310 l14,-10.5 l14,10.5 H352 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H430 l14,-12.6 l14,12.6 H550 l14,-10.5 l14,10.5 H592 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H670 l14,-12.6 l14,12.6 H790 l14,-10.5 l14,10.5 H832 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H910 l14,-12.6 l14,12.6 H1030 l14,-10.5 l14,10.5 H1072 l8,12.6 l10,-54.6 l10,67.2 l8,-25.2 H1150 l14,-12.6 l14,12.6"/>
<text class="t up" x="600" y="100" text-anchor="middle">Ask the Health Library</text>
<text class="s up2" x="600" y="142" text-anchor="middle">Answers written only from NIH patient guides, with the passages to prove it</text>
</svg>
