<style>
:root{--bg:#ffffff;--panel:#f3f8f8;--line:#b7d0d3;--node:#e0f2ef;--accent:#0f8b7e;--ink:#12323a;--muted:#4f6a74;--hot:#d9363e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1720;--panel:#13222c;--line:#2e4a57;--node:#143530;--accent:#3fc8b7;--ink:#e7f3f2;--muted:#a3bbc4;--hot:#ff7a7f}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--line)}
.pt{font-size:16px;font-weight:600;fill:var(--muted)}
.note{font-size:14px;fill:var(--muted);font-style:italic}
.node{fill:var(--node);stroke:var(--accent);stroke-width:1.4}
.lid{fill:none}
.glow{fill:var(--hot);fill-opacity:.13;stroke:var(--hot);stroke-width:2.6}
.glow.lid{fill:none}
.nt{font-size:15px;font-weight:700}
.ns{font-size:13.5px;fill:var(--muted)}
.edge{fill:none;stroke:var(--line);stroke-width:2}
.flow{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 13;animation:d 1.1s linear infinite}
@keyframes d{to{stroke-dashoffset:-18}}
.ah{fill:var(--accent)}
.lb{fill:var(--bg);stroke:var(--line)}
.lt{font-size:13.5px;fill:var(--ink)}
.pk{fill:var(--hot)}
.cap{fill:var(--node);stroke:var(--line)}
.ct{font-size:18px;font-weight:500}
.cn{font-weight:700;fill:var(--accent)}
.track{fill:var(--line)}
.bar{fill:var(--accent)}
</style>
