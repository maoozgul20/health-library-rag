<svg xmlns="http://www.w3.org/2000/svg" width="390" height="140" viewBox="0 0 390 140" role="img" aria-label="Stage 1: Build time. Guides become passages and vectors. Click for details.">
<title>Stage 1: Build time. Guides become passages and vectors. Click for details.</title>
<style>
:root{--bg:#ffffff;--panel:#f3f8f8;--line:#b7d0d3;--node:#e0f2ef;--accent:#0f8b7e;--ink:#12323a;--muted:#4f6a74;--hot:#d9363e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1720;--panel:#13222c;--line:#2e4a57;--node:#143530;--accent:#3fc8b7;--ink:#e7f3f2;--muted:#a3bbc4;--hot:#ff7a7f}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.b{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.f{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:12 88;animation:run 5s linear infinite;animation-delay:0s}
@keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.r{fill:var(--accent);transform-origin:52px 54px;animation:p 2.4s ease-out infinite;animation-delay:0s}
@keyframes p{from{opacity:.5;transform:scale(1)}to{opacity:0;transform:scale(1.8)}}
.c{fill:var(--accent)}.num{font-size:22px;font-weight:700;fill:var(--bg)}
.h{font-size:23px;font-weight:700}.l{font-size:15px;fill:var(--muted)}.o{font-size:14px;font-weight:600;fill:var(--accent)}
</style>
<rect class="b" x="2" y="2" width="386" height="136" rx="16"/><rect class="f" pathLength="100" x="2" y="2" width="386" height="136" rx="16"/>
<circle class="r" cx="52" cy="54" r="22"/><circle class="c" cx="52" cy="54" r="22"/><text class="num" x="52" y="62" text-anchor="middle">1</text>
<text class="h" x="90" y="52">Build time</text><text class="l" x="90" y="78">Guides become passages and vectors</text><text class="o" x="90" y="112">Click for details ↓</text>
</svg>
